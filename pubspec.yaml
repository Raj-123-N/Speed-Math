name: speed_math
description: "Speed Math - Practice and master mental mathematics"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  audioplayers: ^6.5.0
  go_router: ^14.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0
  share_plus: ^10.1.4
  in_app_review: ^2.0.9
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    # Animations
    - asset/animation/battle_winner.json
    - asset/animation/chart_loader.json
    - asset/animation/live.json
    - asset/animation/live_circle.json
    - asset/animation/math_loader3.json
    - asset/animation/quiz_review.json
    - asset/animation/rank.json
    - asset/animation/search_people.json
    # Fonts (image assets, not font declarations)
    # Icons
    - asset/image/icon/2d.webp
    - asset/image/icon/3d.webp
    - asset/image/icon/algebra.webp
    - asset/image/icon/apple.svg
    - asset/image/icon/chat.webp
    - asset/image/icon/complexity.webp
    - asset/image/icon/cross.webp
    - asset/image/icon/cross_2.webp
    - asset/image/icon/cross_3.webp
    - asset/image/icon/cube.webp
    - asset/image/icon/cuberoot.webp
    - asset/image/icon/cuberootn.webp
    - asset/image/icon/division.webp
    - asset/image/icon/duration.webp
    - asset/image/icon/empty_quiz.webp
    - asset/image/icon/fraction.webp
    - asset/image/icon/geometry.webp
    - asset/image/icon/google.svg
    - asset/image/icon/keypad.webp
    - asset/image/icon/leaderboard.webp
    - asset/image/icon/logo.webp
    - asset/image/icon/minus.webp
    - asset/image/icon/mix_advance.webp
    - asset/image/icon/multiply.webp
    - asset/image/icon/option.webp
    - asset/image/icon/percentage.webp
    - asset/image/icon/performance.webp
    - asset/image/icon/plus.webp
    - asset/image/icon/practise.webp
    - asset/image/icon/revision.webp
    - asset/image/icon/revision_2.webp
    - asset/image/icon/revision_3.webp
    - asset/image/icon/score.webp
    - asset/image/icon/share.webp
    - asset/image/icon/share2.webp
    - asset/image/icon/speech-bubbles.webp
    - asset/image/icon/sqareroot.webp
    - asset/image/icon/square.webp
    - asset/image/icon/squarerootn.webp
    - asset/image/icon/stopwatch.webp
    - asset/image/icon/stopwatch_2.webp
    - asset/image/icon/support1.webp
    - asset/image/icon/support2.webp
    - asset/image/icon/table.webp
    - asset/image/icon/tick.webp
    - asset/image/icon/tick_2.webp
    - asset/image/icon/tick_3.webp
    - asset/image/icon/timer.webp
    - asset/image/icon/trigo.webp
    - asset/image/icon/Vector.svg
    - asset/image/icon/wifi.webp
    # Banners
    - asset/image/banner/quiz.webp
    - asset/image/banner/rate.webp
    # Music
    - asset/music/bonus.aac
    - asset/music/end.aac
    - asset/music/lose.aac
    - asset/music/start.aac
    - asset/music/won.aac

  fonts:
    - family: Roboto
      fonts:
        - asset: asset/fonts/Roboto-Regular.ttf
        - asset/fonts/Roboto-Medium.ttf
          weight: 500
        - asset/fonts/Roboto-Bold.ttf
          weight: 700
        - asset/fonts/Roboto-Black.ttf
          weight: 900
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/image/icon/logo.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/image/icon/logo.webp"
  min_sdk_android: 21
