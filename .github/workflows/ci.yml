name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Analyze Code
        run: flutter analyze
      - name: Run Tests
        run: flutter test

  admin-validate:
    name: Admin Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Admin Dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Analyze Admin App
        working-directory: admin_app
        run: flutter analyze

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      # CI-only signing: this key is generated ephemerally and is NEVER a
      # production signing identity. Production releases must use the owner's
      # private android/key.properties + keystore.
      - name: Create Ephemeral CI Signing Key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storepass ci-only-store-password \
            -alias speed_math_ci \
            -keypass ci-only-store-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=SpeedMath CI,O=CI" \
            -noprompt
          cat > android/key.properties <<EOF
          storePassword=ci-only-store-password
          keyPassword=ci-only-store-password
          keyAlias=speed_math_ci
          storeFile=$GITHUB_WORKSPACE/ci-release.jks
          EOF

      - name: Build Release AAB
        run: flutter build appbundle --release
      - name: Build Split Release APKs
        run: flutter build apk --release --split-per-abi
      - name: Report Artifact Sizes
        shell: bash
        run: |
          echo "Release artifact sizes:"
          du -h build/app/outputs/bundle/release/app-release.aab
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print0 | xargs -0 -r du -h
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
