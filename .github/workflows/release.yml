name: Release & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Environment Details
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Setup Android Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
            storePassword=${{ secrets.ANDROID_STORE_PASSWORD || 'efi@0aYd8YiD%s*s' }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'efi@0aYd8YiD%s*s' }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'speedmath' }}
            storeFile=release.jks
            EOF
          elif [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/release.jks" \
              -storepass "efi@0aYd8YiD%s*s" \
              -alias speedmath \
              -keypass "efi@0aYd8YiD%s*s" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SpeedMath,O=SpeedMath,C=US" \
              -noprompt
            cat > android/key.properties <<EOF
            storePassword=efi@0aYd8YiD%s*s
            keyPassword=efi@0aYd8YiD%s*s
            keyAlias=speedmath
            storeFile=$GITHUB_WORKSPACE/release.jks
            EOF
          fi

      - name: Build Split Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="latest"
          fi
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/SpeedMath-${TAG_NAME}-universal.apk
            cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/SpeedMath-${TAG_NAME}.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/SpeedMath-${TAG_NAME}-arm64-v8a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/SpeedMath-${TAG_NAME}-armeabi-v7a.apk
          fi
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab release-artifacts/SpeedMath-${TAG_NAME}.aab
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Speed Math ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
